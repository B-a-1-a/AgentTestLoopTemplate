services:
  app:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    command: bash -lc "pip install -r requirements.txt && streamlit run app.py --server.address 0.0.0.0 --server.port 8501"
    ports:
      - "8501:8501"

networks:
  default:
    name: sandbox-net
